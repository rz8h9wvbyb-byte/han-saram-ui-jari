<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한 사람의 자리</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="intro">

    <div class="overlay"></div>

    <img
        src="gwanghwamun.jpg"
        id="introImage"
        alt="광화문">

    <div class="introContent">

        <h1>한 사람의 자리</h1>

        <p>
            왕은 가장 높은 사람이었을까.<br>
            아니면 가장 무거운 책임을 가진 사람이었을까.
        </p>

        <button id="enterBtn">
            입장하기
        </button>

    </div>

</div>

<section id="main">

<header>

<h2>한 사람의 자리</h2>

<nav>

<a href="#gate">광화문</a>

<a href="#geunjeong">근정전</a>

<a href="#">어좌</a>

<a href="#">일월오봉도</a>

<a href="#">왕의 시선</a>

<a href="#">나의 다짐</a>

</nav>

</header>



<section id="gate">

<div class="gateOverlay"></div>

<div class="gateText">

<h1>광화문</h1>

<p>

궁궐의 시작.

이 문을 통과한 사람은

모두 같은 책임을 지게 된다.

</p>

</div>

</section>



<section id="geunjeong">

<div class="buildingImage">

<img src="gwanghwamun.jpg">

</div>

<div class="buildingText">

<h2>근정전으로</h2>

<p>

왕은 가장 안쪽에 있었다.

가장 높은 곳이 아니라,

가장 무거운 자리에.

</p>

</div>

</section>

</section>

<script src="script.js"></script>

</body>
</html>
